services:
  demalu_backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - /app/node_modules
      - ./src/prisma/migrations:/app/src/prisma/migrations
    ports:
      - 4000:4000
      - 5555:5555
    networks:
      - demalu_network
    env_file: ".env"
    depends_on:
      demalu_db:
        condition: service_healthy
      demalu_redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g

  demalu_db:
    image: postgres:16.0-alpine
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    env_file: ".env"
    ports:
      - 5432:5432
    volumes:
      - demalu_data:/var/lib/postgresql/data
    networks:
      - demalu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  demalu_redis:
    image: redis:8
    ports:
      - "6379:6379"
    networks:
      - demalu_network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c "redis-server --requirepass $${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "bash", "-c", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - demalu_redis:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  demalu-minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    ports:
      - 9090:9090
      - 9000:9000
    networks:
      - demalu_network
    command: server /export --console-address ":9090"
    volumes:
      - demalu_s3_storage:/export
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "alias", "set", "minio", "http://localhost:9000", "${MINIO_ROOT_USER}", "${MINIO_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

volumes:
  demalu_data:
  demalu_redis:
  demalu_s3_storage:

networks:
  demalu_network:
    driver: bridge
